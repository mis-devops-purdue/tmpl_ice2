# Merge bot for MIS 58710 — ICE 2: merges every ready pull request. Instructor-triggered only.
# Run it from the Actions tab (or: python3 merge_ready.py --term fa26). Start with dry_run.
name: Merge Ready Pull Requests
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be merged; change nothing
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: ice2_merge_ready
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Merge ready pull requests
        run: python3 .github/bot/merge_ready.py
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}

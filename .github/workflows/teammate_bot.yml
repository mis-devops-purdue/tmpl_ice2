# Teammate Bot for MIS 58710 — ICE 2 (DevOps Bios): checklist comment on each PR
# Runs the checker from the DEFAULT branch, so a pull request can't change what checks it.
name: Teammate Bot
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: ice2_${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  bot:
    # The bot's own actions never trigger workflows, but skip bots anyway.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/bot
      - name: Run checker
        run: python3 .github/bot/ice2.py
        env:
          GH_TOKEN: ${{ github.token }}
